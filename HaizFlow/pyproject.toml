[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haizflow"
version = "0.1.0"
description = "Free, local-first desktop video dubbing and automation for Windows"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.11.1",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "packaging==26.2",
  "torch==2.8.0+cu128",
  "torchaudio==2.8.0+cu128",
  "torchvision==0.23.0+cu128",
  "whisperx==3.8.6",
  "pyannote-audio==4.0.7",
  "torchcodec==0.7.0",
  "transformers==4.57.6",
  "accelerate==1.14.0",
  "llama-cpp-python==0.3.34",
  "ctranslate2==4.8.1",
  "faster-whisper==1.2.1",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "Pillow==12.3.0",
  "audioop-lts==0.2.2; python_version >= '3.13'",
  "edge-tts==7.2.8",
  # OmniVoice's verified SDK wheel is a first-launch runtime component. Only
  # inference dependencies are frozen; its Gradio demo is intentionally absent.
  "soxr==1.1.0",
  "soundfile==0.14.0",
  # Pin the native ABI used by the tested Windows environment. Newer CFFI
  # releases are not required by SoundFile and needlessly churn the lock.
  "cffi==2.0.0",
  "tokenizers==0.22.2",
  # Keep model clients on the release supported by WhisperX/Transformers.
  "huggingface-hub==0.36.2",
  # Security floor for the transitive Edge TTS/FSSpec HTTP client. Keep this
  # explicit until all upstream constraints naturally resolve to 3.14.3+.
  "aiohttp==3.14.3",
  "websockets==16.0",
  "yt-dlp==2026.7.4",
  "pydub==0.25.1",
  "srt==3.5.3",
  "demucs==4.0.1",
  "rapidocr==3.8.1",
]

[project.scripts]
haizflow = "haizflow.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"haizflow" = ["assets/fonts/Bangers-Regular.ttf"]
"haizflow.desktop" = ["qml/*.qml", "qml/qmldir", "qml/icons/*.svg", "translations/*.qm", "translations/*.ts", "assets/branding/haizflow-mark.png", "assets/branding/haizflow.ico"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
llama-cpp-python = { index = "llama-cpp-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
